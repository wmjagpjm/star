<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozon 数据采集器测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    .test-section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 6px;
      border-left: 4px solid #667eea;
    }
    .test-section h2 {
      margin-top: 0;
      color: #333;
      font-size: 18px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 10px;
      font-family: monospace;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }
    button:hover {
      background: #5568d3;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
    }
    .status.loading {
      background: #fff3cd;
      color: #856404;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .result {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      max-height: 400px;
      overflow-y: auto;
    }
    .result pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 12px;
    }
    .product-card {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
      background: #fafafa;
    }
    .product-card img {
      max-width: 150px;
      border-radius: 4px;
      margin-right: 15px;
    }
    .product-info {
      display: flex;
      align-items: flex-start;
    }
    .product-details {
      flex: 1;
    }
    .product-details h3 {
      margin: 0 0 10px 0;
      color: #333;
    }
    .product-details p {
      margin: 5px 0;
      color: #666;
      font-size: 14px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      background: #667eea;
      color: white;
      border-radius: 3px;
      font-size: 12px;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Ozon 数据采集器测试</h1>
    <p class="subtitle">测试 BCS 逆向的商品数据采集功能</p>

    <!-- 测试 1: 单个商品 -->
    <div class="test-section">
      <h2>测试 1：获取单个商品数据</h2>
      <input type="text" id="singleSku" placeholder="输入商品 SKU，例如：1234567890" value="">
      <button id="testSingleBtn">🚀 获取商品数据</button>
      <button id="clearSingleBtn">🗑️ 清除结果</button>
      <div id="singleStatus"></div>
      <div id="singleResult"></div>
    </div>

    <!-- 测试 2: 批量商品 -->
    <div class="test-section">
      <h2>测试 2：批量获取商品数据</h2>
      <textarea id="batchSkus" rows="4" placeholder="输入多个 SKU，每行一个，例如：&#10;1234567890&#10;9876543210&#10;1111111111"></textarea>
      <button id="testBatchBtn">🚀 批量获取</button>
      <button id="clearBatchBtn">🗑️ 清除结果</button>
      <div id="batchStatus"></div>
      <div id="batchResult"></div>
    </div>

    <!-- 测试 3: 缓存统计 -->
    <div class="test-section">
      <h2>测试 3：缓存管理</h2>
      <button id="showCacheBtn">📊 查看缓存统计</button>
      <button id="clearCacheBtn">🗑️ 清除缓存</button>
      <div id="cacheStatus"></div>
      <div id="cacheResult"></div>
    </div>
  </div>

  <!-- 引入脚本 -->
  <script src="../config.js"></script>
  <script src="../core/ozon-product-fetcher.js"></script>

  <script>
    // 初始化
    const fetcher = new OzonProductFetcher();

    // 工具函数
    function showStatus(elementId, message, type = 'loading') {
      const el = document.getElementById(elementId);
      el.className = `status ${type}`;
      el.textContent = message;
      el.style.display = 'block';
    }

    function hideStatus(elementId) {
      const el = document.getElementById(elementId);
      el.style.display = 'none';
    }

    function showResult(elementId, content, isHTML = false) {
      const el = document.getElementById(elementId);
      if (isHTML) {
        el.innerHTML = content;
      } else {
        el.innerHTML = `<div class="result"><pre>${JSON.stringify(content, null, 2)}</pre></div>`;
      }
    }

    function clearResult(elementId) {
      document.getElementById(elementId).innerHTML = '';
    }

    function renderProductCard(product) {
      const variants = product.variants || [];
      const attributes = product.attributes || [];

      return `
        <div class="product-card">
          <div class="product-info">
            <img src="${product.coverImage || product.images[0] || 'https://via.placeholder.com/150'}" alt="商品图片">
            <div class="product-details">
              <h3>${product.title || '无标题'}</h3>
              <p><strong>SKU:</strong> ${product.sku}</p>
              <p><strong>价格:</strong> ${product.price || '-'} ₽ ${product.oldPrice ? `<span style="text-decoration:line-through;color:#999;">${product.oldPrice} ₽</span>` : ''}</p>
              <p><strong>图片数量:</strong> ${product.images.length} 张</p>
              <p><strong>视频数量:</strong> ${product.videos.length} 个</p>
              <p><strong>变体数量:</strong> ${variants.length} 个</p>
              <p><strong>属性数量:</strong> ${attributes.length} 个</p>
              ${product.tags.length > 0 ? `<p><strong>标签:</strong> ${product.tags.map(t => `<span class="badge">${t}</span>`).join('')}</p>` : ''}
              ${product.description ? `<p><strong>描述:</strong> ${product.description.substring(0, 100)}...</p>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // 测试 1: 单个商品
    document.getElementById('testSingleBtn').addEventListener('click', async function() {
      const sku = document.getElementById('singleSku').value.trim();
      if (!sku) {
        alert('请输入 SKU');
        return;
      }

      this.disabled = true;
      showStatus('singleStatus', '正在获取商品数据...', 'loading');
      clearResult('singleResult');

      try {
        const product = await fetcher.fetchProductData(sku);

        if (product) {
          showStatus('singleStatus', '✅ 获取成功！', 'success');
          showResult('singleResult', renderProductCard(product), true);
        } else {
          showStatus('singleStatus', '❌ 获取失败，请检查 SKU 是否正确', 'error');
        }
      } catch (error) {
        showStatus('singleStatus', `❌ 错误: ${error.message}`, 'error');
      } finally {
        this.disabled = false;
      }
    });

    document.getElementById('clearSingleBtn').addEventListener('click', function() {
      document.getElementById('singleSku').value = '';
      hideStatus('singleStatus');
      clearResult('singleResult');
    });

    // 测试 2: 批量商品
    document.getElementById('testBatchBtn').addEventListener('click', async function() {
      const skusText = document.getElementById('batchSkus').value.trim();
      if (!skusText) {
        alert('请输入 SKU 列表');
        return;
      }

      const skus = skusText.split('\n').map(s => s.trim()).filter(Boolean);
      if (skus.length === 0) {
        alert('请输入有效的 SKU');
        return;
      }

      this.disabled = true;
      showStatus('batchStatus', `正在批量获取 ${skus.length} 个商品...`, 'loading');
      clearResult('batchResult');

      try {
        const products = await fetcher.batchFetch(skus, (current, total) => {
          showStatus('batchStatus', `正在获取 ${current}/${total}...`, 'loading');
        });

        showStatus('batchStatus', `✅ 成功获取 ${products.length}/${skus.length} 个商品`, 'success');

        const html = products.map(p => renderProductCard(p)).join('');
        showResult('batchResult', `<div class="result">${html}</div>`, true);

      } catch (error) {
        showStatus('batchStatus', `❌ 错误: ${error.message}`, 'error');
      } finally {
        this.disabled = false;
      }
    });

    document.getElementById('clearBatchBtn').addEventListener('click', function() {
      document.getElementById('batchSkus').value = '';
      hideStatus('batchStatus');
      clearResult('batchResult');
    });

    // 测试 3: 缓存管理
    document.getElementById('showCacheBtn').addEventListener('click', function() {
      const stats = fetcher.getCacheStats();
      showStatus('cacheStatus', `缓存中有 ${stats.size} 个商品`, 'success');
      showResult('cacheResult', stats);
    });

    document.getElementById('clearCacheBtn').addEventListener('click', function() {
      fetcher.clearCache();
      showStatus('cacheStatus', '✅ 缓存已清除', 'success');
      clearResult('cacheResult');
    });

    // 页面加载完成
    console.log('[测试页面] OzonProductFetcher 已加载');
    console.log('[测试页面] 可以开始测试了！');
  </script>
</body>
</html>
